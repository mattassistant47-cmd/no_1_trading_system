version: '3.8'

networks:
  trading-dev:
    driver: bridge
    name: trading-dev-network

volumes:
  db_dev_data:
    name: trading-dev-db

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: trading-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-trading_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpass123}
      POSTGRES_DB: ${DB_NAME:-trading_dev_db}
    ports:
      - "5433:5432"
    volumes:
      - db_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trading_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - trading-dev

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: trading-dev-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://${DB_USER:-trading_dev}:${DB_PASSWORD:-devpass123}@db:5432/${DB_NAME:-trading_dev_db}"
      MODE: paper
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      ALPACA_API_KEY_PAPER: ${ALPACA_API_KEY_PAPER:-test}
      ALPACA_API_SECRET_PAPER: ${ALPACA_API_SECRET_PAPER:-test}
      FRED_API_KEY: ${FRED_API_KEY:-test}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-devsecret}
      CORS_ORIGINS: "http://localhost:8080,http://localhost:5173"
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - trading-dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trading-dev-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    networks:
      - trading-dev

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: trading-dev-tests
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      MODE: paper
      ENVIRONMENT: testing
      TESTING: "1"
      ALPACA_API_KEY_PAPER: test
      ALPACA_API_SECRET_PAPER: test
      FRED_API_KEY: test
      LOG_LEVEL: WARNING
      PYTHONPATH: /app
    volumes:
      - ./test-reports:/app/test-reports
    command: ["bash", "scripts/run_tests.sh"]
    networks:
      - trading-dev
    profiles:
      - testing
